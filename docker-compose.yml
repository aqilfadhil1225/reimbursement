services:
  minio:
    image: reimbursement-minio:local
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_ENDPOINT}:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in backend/.env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  minio-data:
